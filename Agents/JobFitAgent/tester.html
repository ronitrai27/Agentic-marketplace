<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobFit Agent Live Tester</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #131b26;
    --border: #223043;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --success: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #1e293b;
    color: #60a5fa;
    border: 1px solid #334155;
  }
  .env-switch {
    display: flex;
    background: #16202e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 4px;
  }
  .env-switch button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s;
  }
  .env-switch button.active {
    background: var(--accent);
    color: #fff;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-transform: uppercase;
  }
  input, textarea {
    width: 100%;
    background: #0d131d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: border 0.15s;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button.action-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.15s;
  }
  button.action-btn:hover {
    background: var(--accent-hover);
  }
  button.alt-btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }
  button.alt-btn:hover {
    background: #27354a;
    color: #fff;
  }
  .status-box {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #101722;
    border: 1px solid var(--border);
  }
  .status-box.ok { border-color: rgba(16, 185, 129, 0.4); color: var(--success); }
  .status-box.bad { border-color: rgba(239, 68, 68, 0.4); color: var(--danger); }
  .status-box.warn { border-color: rgba(245, 158, 11, 0.4); color: var(--warn); }
  .progress-bar-wrap {
    height: 4px;
    background: #0d131d;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  pre {
    background: #090d14;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    color: #38bdf8;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow: auto;
    max-height: 400px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .job-card {
    background: #0d131d;
    border: 1px solid #1f2c3d;
    border-radius: 6px;
    padding: 12px;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .job-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .job-sub {
    font-size: 12px;
    color: var(--muted);
  }
  .job-link {
    font-size: 12px;
    color: #38bdf8;
    text-decoration: none;
  }
  .job-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>
      <span>⚡ JobFit Agent Live Tester</span>
      <span class="badge">MAPS Protocol</span>
    </h1>
    <div class="env-switch">
      <button id="env-live" class="active" onclick="switchEnv('live')">Cloud (Live)</button>
      <button id="env-local" onclick="switchEnv('local')">Localhost:3000</button>
    </div>
  </div>

  <div class="card">
    <div>
      <label>Agent Backend URL</label>
      <input id="url" value="https://p01--claude-agent--k8clc8rvc9fq.code.run">
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <label>Bearer Secret Key (cat_sec_live_…)</label>
        <span style="font-size:11px; color:#38bdf8; cursor:pointer;" onclick="toggleKey()">Show / Hide</span>
      </div>
      <input id="key" type="password" value="cat_sec_live_c67619ac727df612b50a6cb1be786046929dc48bf8b8daeca44556e91e5be7e1">
    </div>

    <div class="btn-row">
      <button class="alt-btn" onclick="health()">Check /health</button>
      <button class="alt-btn" onclick="schema()">Fetch /schema</button>
    </div>
  </div>

  <div class="card">
    <label>Job Search Prompt</label>
    <textarea id="prompt" rows="3">remote backend engineer roles in Europe</textarea>

    <div class="btn-row">
      <button class="action-btn" id="run-btn" onclick="run()">▶ POST /execute</button>
      <button class="alt-btn" onclick="stopPoll=true">■ Stop Polling</button>
      <button class="alt-btn" onclick="clearOutput()">Clear</button>
    </div>

    <div class="progress-bar-wrap" id="prog-wrap">
      <div class="progress-bar" id="prog-bar"></div>
    </div>

    <div class="status-box" id="status">Ready</div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label>Response / Stream Output</label>
      <span id="output-meta" style="font-size:11px; color:var(--muted);"></span>
    </div>
    <div id="job-cards"></div>
    <pre id="out">—</pre>
  </div>
</div>

<script>
let stopPoll = false;
const LIVE_URL = "https://p01--claude-agent--k8clc8rvc9fq.code.run";
const LIVE_KEY = "cat_sec_live_c67619ac727df612b50a6cb1be786046929dc48bf8b8daeca44556e91e5be7e1";
const LOCAL_URL = "http://localhost:3000";

const $ = id => document.getElementById(id);
const base = () => $('url').value.trim().replace(/\/$/, '');

function switchEnv(env) {
  if (env === 'live') {
    $('url').value = LIVE_URL;
    $('key').value = LIVE_KEY;
    $('env-live').classList.add('active');
    $('env-local').classList.remove('active');
  } else {
    $('url').value = LOCAL_URL;
    $('key').value = '';
    $('env-local').classList.add('active');
    $('env-live').classList.remove('active');
  }
}

function toggleKey() {
  const k = $('key');
  k.type = k.type === 'password' ? 'text' : 'password';
}

function clearOutput() {
  $('out').textContent = '—';
  $('job-cards').innerHTML = '';
  $('status').className = 'status-box';
  $('status').textContent = 'Ready';
  $('prog-wrap').style.display = 'none';
  $('output-meta').textContent = '';
}

const hdrs = () => {
  const h = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
  const k = $('key').value.trim();
  if (k) h['Authorization'] = 'Bearer ' + k;
  return h;
};

const status = (t, c='') => {
  $('status').className = 'status-box ' + c;
  $('status').textContent = t;
};

const setProgress = (pct) => {
  $('prog-wrap').style.display = 'block';
  $('prog-bar').style.width = Math.min(100, Math.max(0, pct)) + '%';
};

const show = o => {
  $('out').textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2);
  renderJobsIfAny(o);
};

function renderJobsIfAny(o) {
  const target = $('job-cards');
  let jobs = null;
  if (o && o.output && Array.isArray(o.output.jobs)) jobs = o.output.jobs;
  else if (o && Array.isArray(o.jobs)) jobs = o.jobs;

  if (jobs && jobs.length > 0) {
    target.innerHTML = jobs.map(j => `
      <div class="job-card">
        <div class="job-title">${j.title || 'Role'} <span style="color:#10b981">(${j.match_score ?? ''}%)</span></div>
        <div class="job-sub">🏢 ${j.company || 'Unknown'} · 📍 ${j.location || 'Remote'} ${j.salary ? '· 💰 ' + j.salary : ''}</div>
        <div style="font-size:12px; margin-top:2px; color:#cbd5e1;">${j.match_reason || ''}</div>
        ${j.url ? `<a class="job-link" href="${j.url}" target="_blank">View Posting ↗</a>` : ''}
      </div>
    `).join('');
  }
}

async function call(path, opts = {}) {
  const t = performance.now();
  const url = path.startsWith('http') ? path : base() + (path.startsWith('/') ? '' : '/') + path;
  const r = await fetch(url, { headers: hdrs(), ...opts });
  const text = await r.text();
  let body;
  try { body = JSON.parse(text); } catch { body = text; }
  return { ok: r.ok, code: r.status, ms: Math.round(performance.now() - t), body };
}

async function health() {
  clearOutput();
  status('Checking /health...', 'warn');
  try {
    const r = await call('/health');
    status(`/health → ${r.code} (${r.ms}ms)`, r.ok ? 'ok' : 'bad');
    show(r.body);
  } catch(e) {
    status('Network/CORS error: ' + e.message, 'bad');
  }
}

async function schema() {
  clearOutput();
  status('Fetching /schema...', 'warn');
  try {
    const r = await call('/schema');
    status(`/schema → ${r.code} (${r.ms}ms)`, r.ok ? 'ok' : 'bad');
    show(r.body);
  } catch(e) {
    status('Network/CORS error: ' + e.message, 'bad');
  }
}

async function run() {
  stopPoll = false;
  $('job-cards').innerHTML = '';
  show('Submitting task...');
  setProgress(5);
  status('Sending POST /execute...', 'warn');

  try {
    const payload = {
      input: {
        prompt: $('prompt').value.trim()
      }
    };
    const r = await call('/execute', {
      method: 'POST',
      body: JSON.stringify(payload)
    });

    if (r.code === 401 || r.code === 403) {
      status(`Auth failed (${r.code}) — Bearer secret key is incorrect`, 'bad');
      return show(r.body);
    }
    if (!r.ok) {
      status(`/execute error (${r.code})`, 'bad');
      return show(r.body);
    }

    show(r.body);

    const poll = r.body.poll_url || (r.body.run_id && `/tasks/${r.body.run_id}`);
    if (!poll) {
      setProgress(100);
      status('Execution completed (sync response)', 'ok');
      return;
    }

    status(`Accepted (run_id: ${r.body.run_id || 'active'}). Polling progress...`, 'warn');
    const t0 = Date.now();

    while (!stopPoll) {
      await new Promise(s => setTimeout(s, 2000));
      if (stopPoll) {
        status('Polling stopped by user', 'warn');
        break;
      }

      const p = await call(poll);
      const b = p.body || {};
      const secs = Math.round((Date.now() - t0) / 1000);
      const pct = b.progress_pct ?? 20;
      setProgress(pct);

      status(`${b.status || 'running'} · ${b.current_step || ''} · ${pct}% (${secs}s elapsed)`,
        b.status === 'completed' ? 'ok' : (b.status === 'failed' ? 'bad' : 'warn')
      );
      show(b);

      if (b.status === 'completed') {
        setProgress(100);
        status(`Completed in ${secs}s!`, 'ok');
        break;
      }
      if (b.status === 'failed') {
        status(`Agent failed: ${b.error?.message || 'Check logs'}`, 'bad');
        break;
      }
      if (!['working', 'pending', 'queued', 'submitted'].includes(b.status)) {
        break;
      }
      if (secs > 200) {
        status('Timeout after 200s — check server logs', 'bad');
        break;
      }
    }
  } catch(e) {
    status('Network/CORS error: ' + e.message, 'bad');
  }
}
</script>
</body>
</html>
